info:
  title: Cortex API
  description: >-
    REST API for Cortex — organizations, conversations, agents, integrations (Composio, MCP, OpenAPI, databases),
    documents, roles, and members. Authenticate via JWT Bearer token from POST /auth/email/login.
  version: 1.0.0
  contact: {}
tags:
  - name: App
    description: Health check
  - name: Email Authentication
    description: Public auth endpoints
  - name: Auth
    description: Authenticated session management
  - name: Users
    description: Current user profile
  - name: Organizations
    description: Organization CRUD
  - name: Members
    description: Organization membership
  - name: Roles
    description: Organization roles and permissions
  - name: Agents
    description: Scheduled AI agents
  - name: Conversations
    description: Chat conversations and messages
  - name: Executions
    description: Tool execution approvals and usage
  - name: Conversation Personalization
    description: User chat preferences
  - name: Documents
    description: File uploads and widgets
  - name: DocumentBoards
    description: Document board collections
  - name: AiProviders
    description: Organization AI provider keys
  - name: Integrations
    description: Integration registry
  - name: DatabaseIntegrations
    description: Database integrations
  - name: OpenApiIntegrations
    description: OpenAPI spec integrations
  - name: McpIntegrations
    description: MCP server integrations
  - name: ComposioConnections
    description: Composio OAuth connections
  - name: OrgToolkits
    description: Organization Composio toolkits
  - name: ComposioTriggers
    description: Composio event triggers
  - name: ComposioToolkits
    description: Admin Composio toolkit management
  - name: ComposioWebhook
    description: Inbound Composio webhooks
  - name: AuditLogs
    description: Organization audit logs
  - name: ConversationSuperAdmin
    description: Super-admin conversation operations
  - name: Mail
    description: Internal admin mail
  - name: Sms
    description: Internal admin SMS
  - name: Ai
    description: Internal admin AI
  - name: RedisCache
    description: Internal admin Redis cache
servers:
  - url: http://localhost:3001
    description: Local
  - url: "{{baseUrl}}"
    description: Environment variable
components:
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT from POST /auth/email/login
  schemas:
    CreateMailDto:
      type: object
      properties: {}
    CreateSmDto:
      type: object
      properties: {}
    UpdateSmDto:
      type: object
      properties: {}
    CreateAiDto:
      type: object
      properties: {}
    CreateRedisCacheDto:
      type: object
      properties: {}
    RegisterEmailDto:
      type: object
      properties:
        first_name:
          type: string
          description: User first name
          example: John
        last_name:
          type: string
          description: User last name
          example: Doe
        email:
          type: string
          description: User email address
          example: user@example.com
          format: email
        password:
          type: string
          description: User password (minimum 6 characters)
          example: password123
          minLength: 6
      required:
        - first_name
        - last_name
        - email
        - password
    AuthResponse:
      type: object
      properties:
        access_token:
          type: string
          description: JWT access token for authentication
          example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
        user:
          type: object
          description: User information
          properties:
            uuid:
              type: string
              example: 123e4567-e89b-12d3-a456-426614174000
            email:
              type: string
              example: user@example.com
            phone:
              type: string
              example: "+1234567890"
              nullable: true
            first_name:
              type: string
              example: John
              nullable: true
            last_name:
              type: string
              example: Doe
              nullable: true
            created_at:
              type: string
              example: "2024-01-01T00:00:00.000Z"
            updated_at:
              type: string
              example: "2024-01-01T00:00:00.000Z"
      required:
        - access_token
        - user
    LoginEmailDto:
      type: object
      properties:
        email:
          type: string
          description: User email address
          example: user@example.com
          format: email
        password:
          type: string
          description: User password
          example: password123
      required:
        - email
        - password
    WaitlistDto:
      type: object
      properties:
        email:
          type: string
          description: User email address
          example: user@example.com
          format: email
      required:
        - email
    RegisterInvitationDto:
      type: object
      properties:
        invitation_token:
          type: string
          description: Organization invitation token from the invite email
          example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
        first_name:
          type: string
          description: User first name
          example: John
        last_name:
          type: string
          description: User last name
          example: Doe
        password:
          type: string
          description: User password (minimum 6 characters)
          example: password123
          minLength: 6
      required:
        - invitation_token
        - first_name
        - last_name
        - password
    SwitchOrganizationDto:
      type: object
      required:
        - organization_uuid
      properties:
        organization_uuid:
          type: string
          format: uuid
    CreateOrganizationDto:
      type: object
      required:
        - name
      properties:
        name:
          type: string
          minLength: 2
          example: Acme Corp
        logo_url:
          type: string
          nullable: true
          example: https://example.com/logo.png
    UpdateOrganizationDto:
      type: object
      properties:
        name:
          type: string
          minLength: 2
        slug:
          type: string
        logo_url:
          type: string
          nullable: true
    InviteMemberDto:
      type: object
      required:
        - email
        - organization_role_uuid
      properties:
        email:
          type: string
          format: email
        organization_role_uuid:
          type: string
          format: uuid
    UpdateMemberDto:
      type: object
      properties:
        organization_role_uuid:
          type: string
          format: uuid
        status:
          type: string
          enum:
            - ACTIVE
            - INVITED
            - SUSPENDED
    CreateRoleDto:
      type: object
      required:
        - name
      properties:
        name:
          type: string
        permission_keys:
          type: array
          items:
            type: string
    UpdateRoleDto:
      type: object
      properties:
        name:
          type: string
    SetRolePermissionsDto:
      type: object
      required:
        - permission_keys
      properties:
        permission_keys:
          type: array
          items:
            type: string
    UpdateIntegrationDto:
      type: object
      properties: {}
    ToggleIntegrationActionDto:
      type: object
      properties: {}
    CreateDatabaseIntegrationDto:
      type: object
      properties: {}
    TestDatabaseConnectionDto:
      type: object
      properties: {}
    ParseOpenApiSpecDto:
      type: object
      properties: {}
    CreateOpenApiIntegrationDto:
      type: object
      properties: {}
    TestMcpConnectionDto:
      type: object
      properties: {}
    CreateMcpIntegrationDto:
      type: object
      properties: {}
    CreateAiProviderDto:
      type: object
      properties:
        provider:
          type: string
          enum:
            - OPENAI
            - CLAUDE
            - GROK
        api_key:
          type: string
        default_model:
          type: string
        model_routing:
          type: object
        usage_limit_tokens:
          type: number
        usage_limit_cost_usd:
          type: number
        is_default:
          type: boolean
      required:
        - provider
        - api_key
        - default_model
    UpdateAiProviderDto:
      type: object
      properties:
        provider:
          type: string
          enum:
            - OPENAI
            - CLAUDE
            - GROK
        api_key:
          type: string
        default_model:
          type: string
        model_routing:
          type: object
        usage_limit_tokens:
          type: number
        usage_limit_cost_usd:
          type: number
        is_default:
          type: boolean
    CreateConversationDto:
      type: object
      properties:
        title:
          type: string
    UpdateConversationDto:
      type: object
      properties:
        title:
          type: string
        ai_provider:
          type: string
          enum:
            - OPENAI
            - CLAUDE
            - GROK
        ai_model:
          type: string
        ai_research_mode:
          type: string
          enum:
            - DEFAULT
            - SEARCH
            - DEEP_RESEARCH
    SendMessageDto:
      type: object
      properties:
        content:
          type: string
        documentUuids:
          type: array
          items:
            type: string
        integrationUuids:
          type: array
          items:
            type: string
        toolkitSlugs:
          description: Composio toolkit slugs used to scope the agent session.
          type: array
          items:
            type: string
        toolkit_slugs:
          description: Snake_case alias for toolkitSlugs.
          type: array
          items:
            type: string
        toolkitConnectionTiers:
          type: object
          example:
            linear: ORG_SHARED
          description: Preferred Composio connection tier per toolkit slug.
        toolkit_connection_tiers:
          type: object
          example:
            linear: ORG_SHARED
          description: Snake_case alias for toolkitConnectionTiers.
      required:
        - content
    ResolveConnectionTiersDto:
      type: object
      properties:
        choices:
          type: object
          example:
            linear: ORG_SHARED
      required:
        - choices
    UpdateConversationPersonalizationDto:
      type: object
      properties:
        response_style:
          type: string
          enum:
            - DEFAULT
            - PROFESSIONAL
            - FRIENDLY
            - CANDID
            - QUIRKY
            - EFFICIENT
            - CYNICAL
        warm:
          type: string
          enum:
            - LESS
            - DEFAULT
            - MORE
        enthusiastic:
          type: string
          enum:
            - LESS
            - DEFAULT
            - MORE
        headers_lists:
          type: string
          enum:
            - LESS
            - DEFAULT
            - MORE
        emoji:
          type: string
          enum:
            - LESS
            - DEFAULT
            - MORE
        custom_instructions:
          type: string
          maxLength: 8000
    SyncComposioDto:
      type: object
      properties: {}
    CreateComposioToolkitDto:
      type: object
      properties: {}
    UpdateComposioToolkitDto:
      type: object
      properties: {}
    ConnectComposioDto:
      type: object
      required:
        - toolkit_slug
      properties:
        toolkit_slug:
          type: string
        connected_account_id:
          type: string
        connection_tier:
          type: string
          enum:
            - ORG_SHARED
            - USER_PERSONAL
    ComposioCallbackDto:
      type: object
      required:
        - toolkit_slug
      properties:
        toolkit_slug:
          type: string
        connection_request_id:
          type: string
        connected_account_id:
          type: string
        connection_tier:
          type: string
          enum:
            - ORG_SHARED
            - USER_PERSONAL
    UpdateOrgToolPermissionDto:
      type: object
      properties: {}
    CreateComposioTriggerDto:
      type: object
      properties: {}
    UpdateComposioTriggerDto:
      type: object
      properties: {}
    CreateDocumentBoardDto:
      type: object
      properties: {}
    UpdateDocumentBoardDto:
      type: object
      properties: {}
    AddBoardItemDto:
      type: object
      properties: {}
    UpdateUserDto:
      type: object
      properties:
        first_name:
          type: string
          example: John
        last_name:
          type: string
          example: Doe
        email:
          type: string
          example: user@example.com
        phone:
          type: string
          example: "+1234567890"
          nullable: true
    UpdatePasswordDto:
      type: object
      properties:
        current_password:
          type: string
          example: currentPassword123
        new_password:
          type: string
          example: newPassword123
      required:
        - current_password
        - new_password
    CreateAgentDto:
      type: object
      properties:
        title:
          type: string
          example: Daily sales summary
        prompt:
          type: string
          example: Summarize yesterday sales and highlight anomalies.
        cron_expression:
          type: string
          example: 0 9 * * *
          description: 5-field cron expression
        is_enabled:
          type: boolean
          default: true
      required:
        - title
        - prompt
        - cron_expression
    UpdateAgentDto:
      type: object
      properties:
        title:
          type: string
          example: Daily sales summary
        prompt:
          type: string
          example: Summarize yesterday sales and highlight anomalies.
        cron_expression:
          type: string
          example: 0 9 * * *
          description: 5-field cron expression
        is_enabled:
          type: boolean
          default: true
security:
  - bearer: []
